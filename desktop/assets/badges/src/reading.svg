<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="r-bg" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#C23A4E"/><stop offset="0.55" stop-color="#8E1B2E"/><stop offset="1" stop-color="#4E0B17"/>
    </radialGradient>
    <linearGradient id="r-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E2A1"/><stop offset="0.45" stop-color="#D4A848"/><stop offset="1" stop-color="#8A6420"/>
    </linearGradient>
    <linearGradient id="r-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEF"/><stop offset="1" stop-color="#EAD9B0"/>
    </linearGradient>
    <filter id="r-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#r-rim)"/>
  <circle cx="128" cy="128" r="112" fill="url(#r-bg)"/>
  <ellipse cx="128" cy="70" rx="84" ry="46" fill="url(#r-gloss)"/>
  <g filter="url(#r-shadow)">
