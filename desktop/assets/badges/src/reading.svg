      <path d="M72 96 C88 92 104 93 116 99"/><path d="M72 114 C88 110 104 111 116 117"/><path d="M72 132 C88 128 104 129 116 135"/><path d="M72 150 C88 146 104 147 116 153"/>
      <path d="M140 99 C152 93 168 92 184 96"/><path d="M140 117 C152 111 168 110 184 114"/><path d="M140 135 C152 129 168 128 184 132"/>
    </g>
    <path d="M128 86 V182" stroke="#9C8458" stroke-width="3"/>
