<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="a-bg" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#2BA6A0"/><stop offset="0.55" stop-color="#0F7C7C"/><stop offset="1" stop-color="#063F45"/>
    </radialGradient>
    <linearGradient id="a-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E2A1"/><stop offset="0.45" stop-color="#D4A848"/><stop offset="1" stop-color="#8A6420"/>
    </linearGradient>
    <linearGradient id="a-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEF"/><stop offset="1" stop-color="#EAD9B0"/>
    </linearGradient>
    <filter id="a-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#a-rim)"/>
  <circle cx="128" cy="128" r="112" fill="url(#a-bg)"/>
  <ellipse cx="128" cy="70" rx="84" ry="46" fill="url(#a-gloss)"/>
  <g filter="url(#a-shadow)">
    <!-- band -->
    <path d="M62 150 V128 A66 66 0 0 1 194 128 V150" fill="none" stroke="url(#a-cream)" stroke-width="16" stroke-linecap="round"/>
    <path d="M70 128 A58 58 0 0 1 186 128" fill="none" stroke="#C9B58A" stroke-width="3" opacity="0.7"/>
    <!-- ear cups -->
    <rect x="44" y="134" width="40" height="64" rx="16" fill="url(#a-cream)"/>
    <rect x="172" y="134" width="40" height="64" rx="16" fill="url(#a-cream)"/>
    <rect x="70" y="140" width="18" height="52" rx="8" fill="#D4A848" stroke="#8A6420" stroke-width="2"/>
    <rect x="168" y="140" width="18" height="52" rx="8" fill="#D4A848" stroke="#8A6420" stroke-width="2"/>
    <!-- sound waves -->
    <g fill="none" stroke="#F7E2A1" stroke-width="7" stroke-linecap="round">
      <path d="M114 150 Q108 166 114 182"/><path d="M128 142 V190"/><path d="M142 150 Q148 166 142 182"/>
    </g>
  </g>
</svg>
