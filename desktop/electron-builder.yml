appId: com.esheleyni.roza
artifactName: 'Roza-Setup-${version}-x64.${ext}'
files:
  - main.cjs
  - preload.cjs
  - dev-board/*.cjs
  - staging-room-build/**/*
  - kokoro/*.cjs
  - assets/badges/*.png
  - renderer/**/*
extraResources:
  - from: kokoro/service.py
    to: kokoro/service.py
  - from: chatterbox/service.py
    to: chatterbox/service.py
  - from: chatterbox/voices
    to: chatterbox/voices
    filter:
      - "cb_*.wav"
win:
  icon: renderer/images/icon-512x512.png
  target: nsis
mac:
  icon: renderer/images/icon-512x512.png
  target: dir
  # Local Mac builds are unsigned.
  identity: null
nsis:
  oneClick: true
  perMachine: false
publish:
  provider: github
  owner: EshelEyni
  repo: Roza
  channel: latest
